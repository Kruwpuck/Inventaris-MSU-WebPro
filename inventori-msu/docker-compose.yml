services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventori-msu-app
    working_dir: /var/www
    restart: unless-stopped
    mem_limit: 320m
    volumes:
      - ./:/var/www
      # .env.docker dijadikan .env di dalam container
      - ./.env.docker:/var/www/.env
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: inventori-msu-nginx
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: inventori-msu-db
    restart: unless-stopped
    mem_limit: 400m
    # Tuning untuk VPS 1GB RAM: default MySQL 8 minta ~450MB.
    command: >
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --innodb-log-buffer-size=8M
      --max-connections=50
      --table-open-cache=200
    environment:
      MYSQL_DATABASE: inventori_msu
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # PENTING: Jangan gunakan 'ports' di sini untuk keamanan.
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: inventori-msu-pma
    restart: unless-stopped
    mem_limit: 128m
    # Tidak jalan by default. Nyalakan manual saat butuh:
    #   docker compose --profile tools up -d phpmyadmin
    # Akses lewat SSH tunnel: ssh -L 8081:127.0.0.1:8081 syamsululum@103.103.23.189
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db

volumes:
  dbdata:
