server {
    listen 80;
    server_name syamsululum.site www.syamsululum.site;

    # Validasi Let's Encrypt harus dilayani via HTTP, sebelum redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/public;
        default_type "text/plain";
    }

    # Paksa Redirect dari HTTP ke HTTPS
    location / {
        return 301 https://syamsululum.site$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name syamsululum.site www.syamsululum.site;

    # Selaras dengan post_max_size=25M di PHP; form booking menerima
    # proposal PDF 10MB + foto identitas 10MB.
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/syamsululum.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syamsululum.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    root /var/www/public;
    index index.php index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/public;
        default_type "text/plain";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Livewire menyajikan JS-nya lewat route PHP, bukan file di disk.
    # Tanpa blok ini, aturan aset statis di bawah membalasnya 404 dan
    # SELURUH halaman Livewire mati tanpa pesan error apa pun.
    # `^~` wajib: hanya itu yang mengalahkan prioritas `location ~*`.
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Aset statis di-cache lama; hemat request ke PHP di VPS 1 vCPU.
    # Fallback ke index.php, bukan =404: paket lain juga bisa menyajikan
    # .js/.css lewat route, dan =404 mematikannya diam-diam.
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) { deny all; }
}
